version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Gli aggiornamenti di versione maggiore del frontend (React 19, Tailwind 4, plugin di Vite 6) cambiano il comportamento dell'app:
      # si fanno apposta, con un confronto visivo, non con una proposta automatica che poi fallisce. Gli avvisi di sicurezza restano attivi.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
