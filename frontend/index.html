    <title>QUANTO — Finanza agevolata per studi di commercialisti</title>
    <meta name="description" content="QUANTO trova le agevolazioni adatte a ogni cliente dello studio, ne legge le regole dai testi ufficiali, costruisce progetto e budget e li controlla con 60 criteri prima della domanda." />
    <link rel="alternate" type="text/markdown" title="Domande frequenti" href="/faq.md" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Che cos’è QUANTO, in una frase?","acceptedAnswer":{"@type":"Answer","text":"È una piattaforma che aiuta lo studio a svolgere le pratiche di finanza agevolata: trova le agevolazioni adatte a ogni cliente, ne legge le regole dai testi ufficiali, costruisce il progetto e il budget del bando e lo controlla con 60 criteri prima della domanda."}},{"@type":"Question","name":"Scrive il progetto da presentare al posto mio?","acceptedAnswer":{"@type":"Answer","text":"No. QUANTO non scrive la parte descrittiva del progetto, gli obiettivi o la narrativa per la commissione: si occupa della parte numerica, cioè quali agevolazioni spettano, su quali spese, per quale importo e se il budget rispetta le regole."}},{"@type":"Question","name":"Da dove vengono i numeri che QUANTO mostra?","acceptedAnswer":{"@type":"Answer","text":"Da due posti soltanto: i documenti del cliente (bilanci, dichiarazioni, buste paga, registri) e i testi ufficiali del bando. Ogni cifra dice da quale documento o da quale articolo viene."}},{"@type":"Question","name":"Cerca solo tra i bandi già studiati?","acceptedAnswer":{"@type":"Answer","text":"No. Cerca tra tutti i bandi aperti del catalogo. Le schede non ancora lette vengono lette subito, a lotti, quando si apre l’Allocazione."}},{"@type":"Question","name":"Un bando da verificare entra nei totali?","acceptedAnswer":{"@type":"Answer","text":"Mai. Finché manca un dato non si somma, non entra nel piano e il suo importo è mostrato in grigio come «da solo varrebbe · non conta»."}},{"@type":"Question","name":"QUANTO può far passare costi ordinari come costi di progetto?","acceptedAnswer":{"@type":"Answer","text":"No, e non è previsto. Il personale si rendiconta sulle ore realmente dedicate e alla retribuzione vera: i controlli confrontano RAL dichiarata e busta paga e il costo orario con il contratto."}},{"@type":"Question","name":"I documenti dei clienti sono cifrati?","acceptedAnswer":{"@type":"Answer","text":"Sì: ogni file è cifrato a riposo con AES-256-GCM e si decifra solo per l’utente che lo ha caricato."}},{"@type":"Question","name":"Quanto costa QUANTO?","acceptedAnswer":{"@type":"Answer","text":"In questa fase di prova è tutto gratuito. Il piano previsto è di 209 € al mese oppure 1.999 € all’anno, con 15 token al mese inclusi."}}]}</script>
